name: checks

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  selfcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: 自检（语法 / 关键函数 / 死标识符 / HTML 配对 / 版本一致性）
        run: node test.js
